# Test-group matrix consumed by SciML/.github grouped-tests.yml. Each group is
# dispatched into runtests.jl via the GROUP env var. The QA group (Aqua +
# ExplicitImports via SciMLTesting.run_qa) carries its own dependencies in
# test/qa/Project.toml and is not part of the default `All` run's main test env.
[Core]
versions = ["lts", "1", "pre"]

[QA]
versions = ["lts", "1"]
